<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#3c6df0" />
		<link rel="icon" href="/favicon.ico" />
		<link rel="manifest" href="/manifest.json" />
		<title>Matt Gallo | Front end engineering lead</title>
		<script>
			// Apply the saved/system color mode before first paint to avoid a theme flash.
			(function() {
				try {
					var mode = localStorage.getItem('color-mode');
					if (mode !== 'light' && mode !== 'dark') {
						mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.dataset.theme = mode;
					if (mode === 'dark') document.querySelector("link[rel~='icon']").href = '/dark__favicon.ico';
				} catch (e) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
