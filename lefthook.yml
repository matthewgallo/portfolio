# Git hooks — https://lefthook.dev
# Installed automatically on `yarn install`; run `yarn lefthook install` to reinstall.
pre-commit:
  piped: true # format first, then lint the formatted files
  commands:
    format:
      glob: "*.{js,ts,tsx}"
      run: yarn -s prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,ts,tsx}"
      run: yarn -s oxlint --fix {staged_files}
      stage_fixed: true
