<svg xmlns="http://www.w3.org/2000/svg" width="850" height="400">
  <!--
    Film-grain texture: fractal noise, desaturated and contrast-boosted around 50% gray so it reads as
    both light and dark specks under `overlay` blending. Used as a static image (not a live filter)
    so browsers rasterize it once instead of on every animation frame.
  -->
  <filter id="n">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch" />
    <feColorMatrix values="1.8 0 0 0 -0.4  1.8 0 0 0 -0.4  1.8 0 0 0 -0.4  0 0 0 0 1" />
  </filter>
  <rect width="100%" height="100%" filter="url(#n)" />
</svg>
